# fly.toml — Configuración de Fly.io para erp-backend
# Generado para deploy desde GitHub (Fly.io Launch)

app = "erp-backend"
primary_region = "gru"

[build]
  # Usa el Dockerfile en la raíz del proyecto

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    port = 8080
    timeout = "5s"
    type = "http"
